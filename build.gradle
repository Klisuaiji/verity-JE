plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // GeckoLib 4.x is hosted on Cloudsmith (not Maven Central).
    // Provides software.bernie.geckolib (GeoModel, GeoEntityRenderer, GeoAnimatable, ...).
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup("software.bernie.geckolib") }
    }

    // Modrinth Maven — hosts YACL (YetAnotherConfigLib) and other mod dependencies.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup("maven.modrinth") }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Default run configurations.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // GeckoLib 4.x — 3D animation library used for the Verity / Box / Demon entities.
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.8.3"

    // YACL — YetAnotherConfigLib (3.7+), configuration screen library used by VerityClient.
    implementation "maven.modrinth:1eAoo2KR:3.7.0+1.21.1-neoforge"

    // ── langchain4j 1.18.0 (Verity 6.1) ────────────────────────────────────────
    // 6.1 replaced the hand-rolled HTTP AI client with langchain4j: chat models
    // (OpenAI / Ollama / Mistral / Google Gemini), chat-memory stores and the
    // @Tool-based function-calling used by entity/LLM/actions/Tools.
    //
    // ROOT CAUSE OF THE 2026-08-03 CRASH (NoClassDefFoundError:
    // dev/langchain4j/store/memory/chat/ChatMemoryStore):
    // The mod's code imports classes that live in `langchain4j-core`
    //   - dev.langchain4j.agent.tool.Tool / .P
    //   - dev.langchain4j.store.memory.chat.ChatMemoryStore
    //   - dev.langchain4j.memory.ChatMemory
    //   - dev.langchain4j.model.chat.ChatModel
    //   - dev.langchain4j.data.message.*
    // and in the transitive runtime libs (jackson, jtokkit, opennlp, jspecify,
    // langchain4j-http-client). moddev-gradle's jarJar embeds ONLY the artifacts
    // declared explicitly in the `jarJar` configuration — it does NOT pull in
    // transitive dependencies. The previous config only declared the 5 top-level
    // langchain4j model modules, so `langchain4j-core` and every transitive were
    // missing from the shipped jar, causing the startup NoClassDefFoundError.
    // FIX: declare every runtime-needed artifact as jarJar so the mod jar is
    // self-contained. (Overlap between `langchain4j` and `langchain4j-core` is 0
    // classes, so both can be embedded side by side without duplicates.)
    // NOTE on slf4j: langchain4j 1.18 depends on org.slf4j:slf4j-api:2.0.18, while
    // net.neoforged:neoform pins it to { strictly 2.0.9 }. Two conflicting `strictly`
    // constraints are unresolvable, so slf4j-api is excluded from the langchain4j graph
    // — the Minecraft runtime already provides an API-compatible slf4j-api on the
    // classpath, and langchain4j only uses it for logging.
    // NOTE: this used to be a `def langchain4jJar(String coord, String v)` helper,
    // but Groovy does not allow method declarations inside the `dependencies { }`
    // closure — it was a hard parse error ("Unexpected input: '{'") that made the
    // whole project unbuildable. Inlined into the each{} below instead.
    [
            "dev.langchain4j:langchain4j",
            "dev.langchain4j:langchain4j-core",
            "dev.langchain4j:langchain4j-http-client",
            "dev.langchain4j:langchain4j-open-ai",
            "dev.langchain4j:langchain4j-ollama",
            "dev.langchain4j:langchain4j-mistral-ai",
            "dev.langchain4j:langchain4j-google-ai-gemini",
    ].each { coord ->
        jarJar(implementation("${coord}:[1.18.0,)")) {
            version { prefer "1.18.0" }
            exclude group: "org.slf4j", module: "slf4j-api"
        }
    }

    // Transitive runtime libs required by the langchain4j model/http modules
    // (JSON serialization, tokenization, NLP, nullability annotations). Declared
    // explicitly because jarJar does not bundle transitives — without these the
    // mod would crash later (e.g. when an OpenAI/Ollama model is first built).
    [
            "com.fasterxml.jackson.core:jackson-annotations:2.22",
            "com.fasterxml.jackson.core:jackson-core:2.22.1",
            "com.fasterxml.jackson.core:jackson-databind:2.22.1",
            "com.knuddels:jtokkit:1.1.0",
            "org.jspecify:jspecify:1.0.0",
            "org.apache.opennlp:opennlp-tools:2.5.9",
    ].each { coord ->
        jarJar(implementation(coord)) {
            exclude group: "org.slf4j", module: "slf4j-api"
        }
    }

    // Offline speech engine (sherpa-onnx) is OPTIONAL. Drop a sherpa-onnx jar (core + JNI,
    // e.g. sherpa-onnx-all.jar) into ./libs to enable local STT/TTS. If absent, the build
    // still compiles and the mod degrades gracefully to cloud / native-OS voice.
    // NOTE: AiAPI / VerityLocalTTS must be refactored to load sherpa via reflection so they
    // do not require this jar at compile time (see task "voice optional degrade").
    def sherpaJar = file('libs/sherpa-onnx-all.jar')
    if (sherpaJar.exists()) {
        implementation files(sherpaJar)
    }

    // Bundle the optional sherpa-onnx engine into the shipped mod jar. The fat jar
    // (libs/sherpa-onnx-all.jar) carries the com.k2fsa.* classes and the per-platform
    // JNI natives under sherpa-onnx/native/. `implementation files(...)` only puts it
    // on the (dev) classpath; it is NOT auto-bundled into the mod jar, so the shipped
    // jar would be missing com/k2fsa and sherpa-onnx/native — breaking local STT/TTS.
    // The original 5.7.3 distribution bundles them; replicate that here. The mod still
    // compiles and degrades gracefully if the jar is absent.
    jar {
        def bundledSherpa = file('libs/sherpa-onnx-all.jar')
        if (bundledSherpa.exists()) {
            from(zipTree(bundledSherpa)) {
                include 'com/k2fsa/**', 'sherpa-onnx/**'
            }
        }
    }

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
